<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>บัญชีเงินห้องของฉัน</title><link rel="stylesheet" href="dashboard.css"></head>
<body class="student-page"><div id="app" hidden>
<header class="topbar"><div><div class="brand">KC · TREASURY</div><strong>บัญชีเงินห้องของฉัน</strong></div><button id="logout" class="secondary" type="button">ออกจากระบบ</button></header>
<main class="dashboard-shell">
<div class="intro"><div><p class="eyebrow">ข้อมูลของฉัน</p><h1 id="student-name">กำลังโหลด…</h1><p id="student-number" class="muted"></p></div><span id="updated" class="muted"></span></div>
<p id="notice" role="status" class="notice" hidden></p>
<section class="stats" aria-label="สรุปการชำระเงิน">
<div class="stat"><span>จ่ายแล้ว</span><strong id="paid-total">฿0.00</strong><small id="paid-count"></small></div>
<div class="stat"><span>ค้างจ่าย</span><strong id="unpaid-total" class="red">฿0.00</strong><small id="unpaid-count"></small></div>
<div class="stat"><span>ยอดที่เรียกเก็บทั้งหมด</span><strong id="due-total">฿0.00</strong><small>ตามรอบที่ตั้งในระบบ</small></div>
</section>
<section class="panel"><div class="section-head"><div><h2>ประวัติการจ่ายรายวัน</h2><p class="muted">อัปเดตเมื่อเหรัญญิกบันทึกสถานะ</p></div></div><div class="table-scroll"><table><thead><tr><th>วันที่เรียกเก็บ</th><th>ยอดเรียกเก็บ</th><th>สถานะ</th></tr></thead><tbody id="history"></tbody></table></div></section>
<section class="panel"><div class="section-head"><div><h2>ค่าใช้จ่ายของห้อง</h2><p class="muted">รายการที่เหรัญญิกบันทึกไว้</p></div><strong id="class-expense">฿0.00</strong></div><div id="expenses" class="expense-list"></div></section>
</main></div><div id="loading" class="loading">กำลังตรวจสอบบัญชี…</div>
<script type="module" src="dashboard.js"></script></body></html>
