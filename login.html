<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบเหรัญญิก</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Sarabun:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="dashboard.css">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', 'Sarabun', sans-serif;
        }
        /* เพิ่มเอฟเฟกต์เรืองแสงนุ่มๆ ด้านหลังกล่องล็อกอิน */
        .glow-sphere {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-[#0b1329] relative flex items-center justify-center min-h-screen p-4 overflow-hidden select-none">

    <div class="glow-sphere top-[-10%] left-[-10%]"></div>
    <div class="glow-sphere bottom-[-10%] right-[-10%]"></div>

    <div class="relative z-10 w-full max-w-md bg-[#131c35]/70 backdrop-blur-xl rounded-3xl p-8 border border-slate-700/50 shadow-[0_25px_50px_-12px_rgba(0,0,0,0.5)] transition-all duration-300 hover:border-indigo-500/30">
        
        <div class="text-center mb-8">
            <div class="relative inline-flex mb-4">
                <div class="absolute inset-0 bg-indigo-500 rounded-2xl blur-md opacity-40 animate-pulse"></div>
                <div class="relative bg-gradient-to-tr from-indigo-600 to-violet-500 w-14 h-14 rounded-2xl flex items-center justify-center text-white text-2xl shadow-xl">
                    <i class="fas fa-vault"></i>
                </div>
            </div>
            <h2 class="text-xl font-extrabold text-white tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">
                ระบบล็อกอินเหรัญญิก
            </h2>
            <p class="text-xs text-slate-400 mt-1.5 font-medium">เฉพาะผู้ดูแลระบบและแอดมินห้องเรียนเท่านั้น</p>
        </div>
        
        <form id="login-form" class="space-y-5">
            <div class="space-y-1.5">
                <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-widest pl-1">
                    ชื่อผู้ใช้งาน (Username)
                </label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-500 text-xs">
                        <i class="fas fa-user-shield"></i>
                    </span>
                    <input type="text" id="login-username" required autocomplete="off" placeholder="กรอกชื่อผู้ใช้งาน..."
                        class="w-full pl-11 pr-4 py-3.5 bg-[#0b1329]/60 border border-slate-700/60 rounded-2xl text-slate-200 text-xs placeholder:text-slate-600 focus:outline-none focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-500 transition-all duration-200">
                </div>
            </div>

            <div class="space-y-1.5">
                <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-widest pl-1">
                    รหัสผ่าน (Password)
                </label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-500 text-xs">
                        <i class="fas fa-key"></i>
                    </span>
                    <input type="password" id="login-password" required placeholder="••••••••"
                        class="w-full pl-11 pr-4 py-3.5 bg-[#0b1329]/60 border border-slate-700/60 rounded-2xl text-slate-200 text-xs placeholder:text-slate-600 focus:outline-none focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-500 transition-all duration-200">
                </div>
            </div>
            
            <div class="flex items-center justify-between pt-1">
                <label class="flex items-center group cursor-pointer select-none">
                    <input type="checkbox" id="login-remember" checked 
                        class="accent-indigo-500 w-4 h-4 bg-slate-900 border-slate-700 rounded focus:ring-indigo-500/30">
                    <span class="ml-2.5 text-xs font-semibold text-slate-400 group-hover:text-slate-300 transition-colors">
                        ล็อกอินค้างไว้ในระบบ
                    </span>
                </label>
            </div>

            <button type="submit" 
                class="w-full relative mt-2 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white text-xs font-bold py-3.5 rounded-2xl shadow-lg shadow-indigo-600/20 transition-all duration-200 cursor-pointer hover:shadow-indigo-600/30 active:scale-[0.98] focus:outline-none focus:ring-2 focus:ring-indigo-500/50">
                <span class="flex items-center justify-center gap-2">
                    เข้าสู่ระบบ <i class="fas fa-arrow-right text-[10px] transition-transform group-hover:translate-x-1"></i>
                </span>
            </button>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDg3OY7bSroS76kKIaB8YxEEvdrZAuhn0Q",
            authDomain: "kc-smart-6e44d.firebaseapp.com",
            databaseURL: "https://kc-smart-6e44d-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "kc-smart-6e44d",
            storageBucket: "kc-smart-6e44d.firebasestorage.app",
            messagingSenderId: "1042713591777",
            appId: "1:1042713591777:web:33a8400b8e78d1dca55ca0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        if (localStorage.getItem('admin_session') === 'authenticated' || sessionStorage.getItem('admin_session') === 'authenticated') {
            window.location.href = 'treasury.html';
        }

        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const userIn = document.getElementById('login-username').value.trim();
            const passIn = document.getElementById('login-password').value;
            const rememberMe = document.getElementById('login-remember').checked;

            const adminRef = ref(db, 'system_config/admin_accounts');
            get(adminRef).then((snapshot) => {
                if (snapshot.exists()) {
                    const accounts = snapshot.val();
                    let isValid = false;

                    Object.values(accounts).forEach(account => {
                        if (account.username === userIn && account.password === passIn) {
                            isValid = true;
                        }
                    });

                    if (isValid) {
                        if (rememberMe) {
                            localStorage.setItem('admin_session', 'authenticated');
                        } else {
                            sessionStorage.setItem('admin_session', 'authenticated');
                        }
                        window.location.href = 'treasury.html';
                    } else {
                        alert('❌ ชื่อผู้ใช้งานหรือรหัสผ่านไม่ถูกต้อง');
                    }
                } else {
                    alert('❌ ไม่พบข้อมูลแอดมินในระบบ Firebase');
                }
            }).catch((err) => {
                console.error(err);
                alert('เกิดข้อผิดพลาดในการเชื่อมต่อคลาวด์');
            });
        });
    </script>
</body>
</html>
